name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: ./test.sh unit

      - name: Run robot tests
        run: ./test.sh robot
        env:
          WITH_DEPS: 1

      - name: Run pylint
        run: ./test.sh lint

      - name: Upload robot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: |
            log.html
            report.html
            output.xml
            robot_server.log
